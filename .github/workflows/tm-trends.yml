name: Fetch Transfermarkt Most Viewed Players

on:
  workflow_dispatch:
  schedule:
    - cron: '15 * * * *'

permissions:
  contents: write

jobs:
  update-tm-history:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Transfermarkt trends
        run: node scripts/fetch-tm-trends.mjs

      - name: Commit updated tm-history.json
        run: |
          git config user.name "tm-trend-bot"
          git config user.email "actions@users.noreply.github.com"
          git add tm-history.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update tm-history.json"
            git push
          fi
